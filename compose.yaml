name: bobo-learning

services:
  service:
    build:
      context: .
      dockerfile: Service/Dockerfile
    image: bobo-learning-service:0.2.2
    ports:
      - "${BOBO_API_PORT:-5171}:8080"
    volumes:
      - type: bind
        source: ${BOBO_MEDIA_HOST_PATH:-./Service/media}
        target: /app/media
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: cover-cache
        target: /app/cover-cache
      - type: bind
        source: ${BOBO_UPDATE_HOST_PATH:-./Service/updates}
        target: /app/updates
        read_only: true
        bind:
          create_host_path: false
    environment:
      BOBO_BIND: 0.0.0.0:8080
      BOBO_MEDIA_DIR: /app/media
      BOBO_COVER_CACHE_DIR: /app/cover-cache
      BOBO_UPDATE_DIR: /app/updates
      BOBO_DEFAULT_COVER_PATH: /app/default-cover.png
      BOBO_FFMPEG_BIN: ffmpeg
      BOBO_COVER_CAPTURE_SECS: ${BOBO_COVER_CAPTURE_SECS:-3}
      BOBO_SCAN_DEBOUNCE_MS: 1500
      BOBO_SCAN_INTERVAL_SECS: 10
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  client:
    build:
      context: .
      dockerfile: Client/Dockerfile
      args:
        API_BASE_URL: ${BOBO_PUBLIC_API_BASE_URL:-https://wx.jiayuntong.com:5172/server/}
    image: bobo-learning-client:0.2.4
    depends_on:
      service:
        condition: service_healthy
    ports:
      - "${BOBO_WEB_PORT:-5170}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --output-document=- http://127.0.0.1:8080/healthz | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  cover-cache:
