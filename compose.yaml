name: bobo-learning

services:
  bobo-learning:
    build:
      context: .
      dockerfile: Service/Dockerfile
    image: bobo-learning:0.1.0
    ports:
      - "${BOBO_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ${BOBO_MEDIA_HOST_PATH:-./Service/media}
        target: /app/media
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: cover-cache
        target: /app/cover-cache
    environment:
      BOBO_BIND: 0.0.0.0:8080
      BOBO_MEDIA_DIR: /app/media
      BOBO_WEB_DIR: /app/web
      BOBO_COVER_CACHE_DIR: /app/cover-cache
      BOBO_DEFAULT_COVER_PATH: /app/default-cover.png
      BOBO_FFMPEG_BIN: ffmpeg
      BOBO_COVER_CAPTURE_SECS: ${BOBO_COVER_CAPTURE_SECS:-3}
      BOBO_SCAN_DEBOUNCE_MS: 1500
      BOBO_SCAN_INTERVAL_SECS: 10
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  cover-cache:
