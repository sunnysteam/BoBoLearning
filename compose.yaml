name: bobo-learning

services:
  service:
    build:
      context: .
      dockerfile: Service/Dockerfile
    image: bobo-learning-service:0.2.4
    ports:
      - "${BOBO_API_PORT:-5171}:8080"
    volumes:
      - type: bind
        source: ${BOBO_MEDIA_HOST_PATH:-./Service/media}
        target: /app/media
        bind:
          create_host_path: false
      - type: volume
        source: cover-cache
        target: /app/cover-cache
      - type: bind
        source: ${BOBO_HLS_HOST_PATH:-./Service/hls-cache}
        target: /app/hls-cache
        bind:
          create_host_path: false
      - type: bind
        source: ${BOBO_UPDATE_HOST_PATH:-./Service/updates}
        target: /app/updates
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${BOBO_BAIDU_AUTH_HOST_PATH:-./Service/baidu-auth}
        target: /app/baidu-auth
        bind:
          create_host_path: false
    environment:
      BOBO_BIND: 0.0.0.0:8080
      BOBO_MEDIA_DIR: /app/media
      BOBO_COVER_CACHE_DIR: /app/cover-cache
      BOBO_HLS_CACHE_DIR: /app/hls-cache
      BOBO_UPDATE_DIR: /app/updates
      BOBO_DEFAULT_COVER_PATH: /app/default-cover.png
      BOBO_FFMPEG_BIN: ffmpeg
      BOBO_COVER_CAPTURE_SECS: ${BOBO_COVER_CAPTURE_SECS:-3}
      BOBO_HLS_PREWARM_LIMIT: ${BOBO_HLS_PREWARM_LIMIT:-0}
      BOBO_SCAN_DEBOUNCE_MS: 1500
      BOBO_SCAN_INTERVAL_SECS: 10
      BOBO_BAIDU_ENABLED: ${BOBO_BAIDU_ENABLED:-false}
      BOBO_BAIDU_ROOT_PATH: ${BOBO_BAIDU_ROOT_PATH:-/菠萝乐园}
      BOBO_BAIDU_TOKEN_PATH: /app/baidu-auth/token.json
      BOBO_BAIDU_CACHE_SECS: ${BOBO_BAIDU_CACHE_SECS:-60}
      BAIDU_NETDISK_APP_KEY: ${BAIDU_NETDISK_APP_KEY:-}
      BAIDU_NETDISK_SECRET_KEY: ${BAIDU_NETDISK_SECRET_KEY:-}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  client:
    build:
      context: .
      dockerfile: Client/Dockerfile
      args:
        API_BASE_URL: ${BOBO_PUBLIC_API_BASE_URL:-https://wx.jiayuntong.com:5172/server/}
    image: bobo-learning-client:0.2.9
    depends_on:
      service:
        condition: service_healthy
    ports:
      - "${BOBO_WEB_PORT:-5170}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --output-document=- http://127.0.0.1:8080/healthz | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  cover-cache:

networks:
  default:
    name: bobo-learning-runtime
    driver: bridge
    driver_opts:
      # 兼容部分服务器经 NAT 访问百度 HTTPS 时的路径 MTU，避免 TLS 握手分片超时。
      com.docker.network.driver.mtu: "1400"
