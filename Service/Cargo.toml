[package]
name = "bobo_learning_service"
version = "0.2.5"
edition = "2024"
rust-version = "1.98"
description = "菠萝乐园儿童内容服务"
publish = false

[dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.9", features = ["http1", "json", "tokio"] }
natord = "1.0.9"
notify = "8.2.0"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tokio = { version = "1.53.1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.7.1", features = ["cors", "fs", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
walkdir = "2.5.0"

[dev-dependencies]
http-body-util = "0.1.3"
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
